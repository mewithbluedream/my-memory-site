<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珍藏回憶相簿</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>我們的美好回憶</h1>
        <p>每一張照片，都是一段閃閃發光的時光</p>
    </header>

    <main>
        <!-- 載入中動畫 -->
        <div id="loading" class="loading">照片載入中...</div>
        <!-- 相簿展廊 -->
        <div class="gallery-grid" id="gallery"></div>
    </main>

    <!-- 圖片點擊放大 (Lightbox) -->
    <div id="lightbox" class="lightbox" style="display:none; flex-direction: column; align-items: center; justify-content: center;">
        <span class="close" style="position: absolute; top: 20px; right: 30px; cursor: pointer; color: white; font-size: 2rem;">&times;</span>
        <img id="lightbox-img" src="" alt="大圖" style="max-width: 80%; max-height: 60vh; object-fit: contain;">
        
        <!-- 備註編輯與輸入區塊 -->
        <div class="caption-box" style="margin-top: 15px; text-align: center;">
            <input type="text" id="lightbox-caption-input" placeholder="輸入這張照片的備註..." style="padding: 8px; width: 300px; border-radius: 4px; border: none; margin-right: 8px;">
            <button id="save-caption-btn" style="padding: 8px 15px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">儲存備註</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
