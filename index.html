<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珍藏回憶相簿</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>屁屁</h1>
        <p>目前開發進度1趴</p>
    </header>

    <main>
        <!-- 載入中動畫 -->
        <div id="loading" class="loading">照片載入中...</div>
        <!-- 相簿展廊 -->
        <div class="gallery-grid" id="gallery"></div>
    </main>

    <!-- 圖片點擊放大 (Lightbox) -->
    <div id="lightbox" class="lightbox" style="display:none; flex-direction: column; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; overflow-y: auto; padding: 20px;">
        <span class="close" style="position: absolute; top: 20px; right: 30px; cursor: pointer; color: white; font-size: 2rem; z-index: 1010;">&times;</span>
        
        <!-- 照片與畫布重疊容器 -->
        <div id="canvas-container" style="position: relative; display: inline-block; max-width: 80%; max-height: 50vh;">
            <img id="lightbox-img" src="" alt="大圖" style="display: block; max-width: 100%; max-height: 50vh; object-fit: contain;">
            <canvas id="doodle-canvas" style="position: absolute; top: 0; left: 0; pointer-events: none; cursor: crosshair;"></canvas>
        </div>

        <!-- 塗鴉控制按鈕列 -->
        <div class="doodle-bar" style="margin-top: 10px; display: flex; gap: 10px;">
            <button id="toggle-doodle-btn" style="padding: 6px 12px; background: #ff4757; color: white; border: none; border-radius: 4px; cursor: pointer;">✏️ 開始塗鴉</button>
            <button id="clear-doodle-btn" style="display: none; padding: 6px 12px; background: #ffa502; color: white; border: none; border-radius: 4px; cursor: pointer;">🗑️ 清除畫布</button>
        </div>
        
        <!-- 留言板容器 -->
        <div class="comment-section" style="width: 320px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; margin-top: 15px; color: white;">
            <div id="comment-list" style="max-height: 120px; overflow-y: auto; text-align: left; font-size: 0.9rem; margin-bottom: 10px; white-space: pre-wrap; border-bottom: 1px solid #555; padding-bottom: 8px;">載入中...</div>
            <div style="display: flex;">
                <input type="text" id="lightbox-comment-input" placeholder="留個言吧..." style="flex: 1; padding: 6px; border-radius: 4px; border: none; margin-right: 6px;">
                <button id="send-comment-btn" style="padding: 6px 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">送出</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
